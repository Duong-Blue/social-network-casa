worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----- Logging -----
    log_format main '$remote_addr - $request_method [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # ----- Tăng giới hạn upload (khớp với Spring Boot) -----
    client_max_body_size 500M;
    proxy_request_buffering off;
    proxy_buffering off;

    # ----- Gzip Compression (Tối ưu hóa dung lượng truyền tải) -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/xml application/javascript;

    # ----- Rate Limiting Zone (Chống DDoS & Spam) -----
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # ----- Reverse Proxy Cache Zone (Bộ đệm cho file tĩnh) -----
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=media_cache:10m max_size=1g inactive=60m;

    # ================================================================
    # Upstream: social-core-service (Spring Boot, port 8080)
    # ================================================================
    upstream social_core {
        server social-core-service:8080;
        keepalive 32;
    }

    # ================================================================
    # Upstream: communication-service (NestJS, port 3000)
    # ================================================================
    upstream communication {
        server communication-service:3000;
        keepalive 32;
    }

    # Upstream cho Socket.io (NestJS Gateway lắng nghe trên port 3001)
    upstream communication_socket {
        server communication-service:3001;
        keepalive 32;
    }

    # ================================================================
    # Server block chính
    # ================================================================
    server {
        listen 80;
        server_name localhost;

        # ---- Header chung cho mọi request ----
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version                 1.1;

        # Timeout hợp lý cho REST API
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # ============================================================
        # 1. Social Core Service – REST API
        #    Ví dụ: GET /api/users, POST /api/posts
        # ============================================================
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://social_core;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ============================================================
        # 2. Social Core Service – Static Files (ảnh, video, audio)
        #    Ví dụ: GET /uploads/images/abc.jpg, GET /images/abc.jpg
        # ============================================================
        location /uploads/ {
            proxy_cache media_cache;
            proxy_cache_valid 200 30m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
            proxy_pass http://social_core;
        }

        location /images/ {
            proxy_cache media_cache;
            proxy_cache_valid 200 30m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
            proxy_pass http://social_core;
        }

        location /videos/ {
            proxy_cache media_cache;
            proxy_cache_valid 200 30m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
            proxy_pass http://social_core;
        }

        location /audios/ {
            proxy_cache media_cache;
            proxy_cache_valid 200 30m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
            proxy_pass http://social_core;
        }

        location /files/ {
            proxy_pass http://communication;
        }

        # ============================================================
        # 3. Communication Service – WebSocket (Socket.io)
        #    Socket.io bắt đầu bằng polling HTTP sau đó upgrade lên WS.
        #    Nginx phải forward cả 2 giao thức.
        # ============================================================
        location /socket.io/ {
            proxy_pass http://communication_socket;

            # Bật WebSocket upgrade
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Tắt buffering – cần thiết cho realtime
            proxy_buffering    off;
            proxy_cache_bypass $http_upgrade;

            # Timeout dài hơn cho kết nối WebSocket persistent
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ============================================================
        # Internal Auth Validation Endpoint
        # ============================================================
        location = /auth-verify {
            internal;
            proxy_pass http://social_core/api/v1/auth/gateway-verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
        }

        # Bypass xác thực JWT cho API lấy tất cả stories công khai
        location /chat/stories/all {
            auth_request off;
            add_header X-Matched-Location "stories-all" always;
            limit_req zone=api_limit burst=30 nodelay;
            rewrite ^/chat/(.*)$ /$1 break;
            proxy_pass http://communication;
        }

        # ============================================================
        # 4. Communication Service – REST API (chat, group, message)
        #    Ví dụ: GET /chat/conversations, POST /chat/messages
        # ============================================================
        location /chat/ {
            auth_request /auth-verify;
            add_header X-Matched-Location "chat-protected" always;
            limit_req zone=api_limit burst=30 nodelay;
            rewrite ^/chat/(.*)$ /$1 break;
            proxy_pass http://communication;
        }

        # ============================================================
        # 5. Health check của API Gateway
        # ============================================================
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # ============================================================
        # 6. Fallback – trả về 404 rõ ràng thay vì lỗi Nginx mặc định
        # ============================================================
        location / {
            return 404 '{"error":"Route not found. Available prefixes: /api/, /chat/, /socket.io/, /uploads/, /images/, /videos/, /audios/, /files/"}';
            add_header Content-Type application/json;
        }
    }
}
